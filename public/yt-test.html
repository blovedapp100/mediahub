<!doctype html>
<html><head><meta charset="utf-8"><title>YT browser extraction test</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
  const out = document.getElementById('out');
  const log = (s) => { out.textContent += '\n' + s; };
  try {
    const { Innertube } = await import('https://cdn.jsdelivr.net/npm/youtubei.js@18.3.0/bundle/browser.js');
    log('bundle loaded');
    const yt = await Innertube.create();
    log('innertube created');
    const info = await yt.getInfo('yOmqb_dxzWc');
    const sd = info.streaming_data || {};
    const fmts = sd.formats || [];
    const adapt = sd.adaptive_formats || [];
    log('title: ' + (info.basic_info?.title || ''));
    log('formats: ' + fmts.length + ' adaptive: ' + adapt.length);
    const all = [...fmts, ...adapt];
    const withUrl = all.filter(f => f.url).length;
    const withCipher = all.filter(f => f.signature_cipher || f.cipher).length;
    log('with direct url: ' + withUrl + ' ciphered: ' + withCipher);
    if (all[0]) log('first: itag=' + all[0].itag + ' mime=' + (all[0].mime_type || '') + ' url=' + String(all[0].url || '').slice(0, 90));
    log('RESULT: ' + (withUrl > 0 ? 'BROWSER-EXTRACTION-WORKS' : 'NO-DIRECT-URL'));
  } catch (e) {
    log('ERROR: ' + (e && e.message ? e.message : String(e)));
    log('RESULT: FAILED');
  }
  document.title = 'DONE';
</script>
</body></html>
