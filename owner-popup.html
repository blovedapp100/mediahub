<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Save Video Cookie Sync</title>
<style>
  body { width: 300px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; color: #1a2b2e; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p.sub { font-size: 12px; color: #5b6b6e; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #e3e8e9; }
  .row b { font-weight: 600; }
  .ok { color: #0a7a4d; }
  .bad { color: #b3261e; }
  #last { font-size: 12px; color: #5b6b6e; margin: 10px 0; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 8px; background: #0f766e; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #gate { display: none; font-size: 12px; line-height: 1.45; color: #7a5b00; background: #fff8e1; border: 1px solid #f0d48a; border-radius: 8px; padding: 8px 10px; margin: 0 0 12px; }
  #status { font-size: 12px; margin-top: 8px; min-height: 15px; }
</style>
</head>
<body>
  <h1>Save Video Cookie Sync</h1>
  <p class="sub">Syncs your own browser cookies to your Save Video servers so downloads keep working. Private — owner only.</p>
  <div id="gate"></div>
  <div id="rows"></div>
  <div id="last">Never synced yet.</div>
  <button id="syncNow" type="button">Sync now</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
